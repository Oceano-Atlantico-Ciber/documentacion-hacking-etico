<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hack the Leaderboard</title>
<style>
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#5f5e58;--line:#e4e1d8;--card:#fff;--accent:#0b6e4f;--warn:#b45309}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--fg:#ecebe6;--muted:#a3a198;--line:#2e2d2a;--card:#1c1c1a;--accent:#5cc8a1;--warn:#f0b35a}}
:root[data-theme="dark"]{--bg:#141413;--fg:#ecebe6;--muted:#a3a198;--line:#2e2d2a;--card:#1c1c1a;--accent:#5cc8a1;--warn:#f0b35a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:20px}
h1{margin:0;font-size:28px}
.mode{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
input,button{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid var(--line)}
button{background:var(--accent);color:#fff;border:0;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#click-button{width:100%;height:160px;font-size:40px;margin-top:12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:14px}
.flag{display:inline-block;background:var(--warn);color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;margin:1px}
body.scoreboard main{max-width:1200px;font-size:26px}
body.scoreboard #game-panel{display:none}
body.scoreboard h1{font-size:48px}
</style>
</head>
<body>
<main>
<header>
<h1>Hack the Leaderboard</h1>
<p class="mode">Ten seconds. Click as many times as you can. Server mode: <b id="mode">…</b>. Estimated human maximum: <b id="max-score">…</b> points. Add <code>?scoreboard</code> to the URL for the projector.</p>
</header>

<section class="card" id="game-panel">
<label>Your name <input id="name-input" maxlength="24" placeholder="Display name"></label>
<button id="start-button">Start game</button>
<button id="click-button" disabled>Click</button>
<p id="status">Enter your name and click Start game.</p>
</section>

<section class="card">
<h2>Leaderboard</h2>
<table><thead><tr><th>#</th><th>Player</th><th>Score</th><th>Flags</th></tr></thead><tbody id="leaderboard"></tbody></table>
</section>
</main>

<script>
// In trusted mode, the browser calculates and sends the score when the game ends.
// In validated mode, every click is sent to the server, which keeps the score.
// TODO: Remove the test route /api/admin/reset?name=... before release.
// TODO: Remove the old score editor endpoint: PUT /api/score/{name}.
const FLAGS = {
  impossible: "Impossible score",
  no_browser: "No browser",
  hidden_route: "Hidden admin route",
  other_player: "Changed another player's score",
};
const HEADERS = { "Content-Type": "application/json", "X-Game": "browser" };
const byId = (id) => document.getElementById(id);
if (location.search.includes("scoreboard")) document.body.classList.add("scoreboard");

let mode = "trusted";
let gameSession = null; // { gameId, name, score, endTime }
let timer = null;

async function api(path, body) {
  const response = await fetch(path, { method: "POST", headers: HEADERS, body: JSON.stringify(body) });
  return response.json();
}

async function refreshLeaderboard() {
  const data = await (await fetch("/api/leaderboard")).json();
  mode = data.mode;
  byId("mode").textContent = mode;
  byId("max-score").textContent = data.max_score;
  byId("leaderboard").innerHTML = data.leaderboard.map((player, index) =>
    `<tr><td>${index + 1}</td><td>${escapeHtml(player.name)}</td><td>${player.score}</td><td>${player.flags.map(flag => `<span class="flag">${FLAGS[flag] ?? flag}</span>`).join(" ")}</td></tr>`
  ).join("");
}

function escapeHtml(text) {
  return text.replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[character]));
}

byId("start-button").addEventListener("click", async () => {
  const name = byId("name-input").value.trim();
  if (!name) return (byId("status").textContent = "Enter a name first.");
  const game = await api("/api/game", { name });
  if (game.error) return (byId("status").textContent = game.error);
  gameSession = {
    gameId: game.game_id,
    name,
    score: 0,
    endTime: Date.now() + game.duration * 1000,
  };
  byId("click-button").disabled = false;
  byId("start-button").disabled = true;
  timer = setInterval(tick, 100);
});

function tick() {
  const remainingMs = Math.max(0, gameSession.endTime - Date.now());
  byId("status").textContent = `${(remainingMs / 1000).toFixed(1)} s · ${gameSession.score} points`;
  if (remainingMs === 0) finishGame();
}

byId("click-button").addEventListener("click", async () => {
  if (!gameSession) return;
  if (mode === "validated") {
    const response = await api("/api/click", { game_id: gameSession.gameId });
    if (!response.error) gameSession.score = response.score;
  } else {
    gameSession.score += 1;
  }
});

async function finishGame() {
  clearInterval(timer);
  byId("click-button").disabled = true;
  byId("start-button").disabled = false;
  const response = mode === "validated"
    ? await api("/api/finish", { game_id: gameSession.gameId })
    : await api("/api/score", { name: gameSession.name, score: gameSession.score });
  byId("status").textContent = `Game over: ${response.score ?? gameSession.score} points.`;
  gameSession = null;
  refreshLeaderboard();
}

refreshLeaderboard();
setInterval(refreshLeaderboard, 5000);
</script>
</body>
</html>

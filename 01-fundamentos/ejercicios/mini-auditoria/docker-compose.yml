# Laboratorio de la mini auditoría: la nube emulada, dos servidores de la empresa
# y un sensor Suricata pegado al servidor web. El puesto del auditor es otro contenedor de la misma red.
# Se copia a fundamentos/mini-auditoria/ del repositorio del alumno y se lanza desde ahí.
#   docker compose run --rm terraform apply                       # la empresa corregida (../terraform) en este Floci
#   docker compose up -d                                          # levanta todo
#   docker compose run --rm auditor -sn 172.28.0.0/24             # el auditor usa nmap
#   docker compose run --rm aws iam list-users                    # y la CLI de AWS contra Floci
#   docker compose run --rm curl -i http://172.28.0.20/           # y curl contra la web
#   docker compose logs -f suricata                               # qué ve el sensor
name: fundamentos-mini-auditoria
services:
  floci:
    image: floci/floci:latest
    container_name: floci
    ports:
      - "4566:4566"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_REGION: eu-west-1
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    volumes:
      - floci-data:/app/data
    networks:
      lab:
        ipv4_address: 172.28.0.10

  web:
    image: nginx:1.27-alpine
    container_name: web
    volumes:
      - ./web:/usr/share/nginx/html:ro
    networks:
      lab:
        ipv4_address: 172.28.0.20

  datos:
    image: postgres:16-alpine
    container_name: datos
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar-en-clase}
    networks:
      lab:
        ipv4_address: 172.28.0.30

  suricata:
    image: jasonish/suricata:7.0
    container_name: suricata
    network_mode: "service:web"          # ve exactamente el tráfico que llega al servidor web
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    command: -i eth0 -S /etc/suricata/rules/local.rules -l /var/log/suricata
    volumes:
      - ./suricata/local.rules:/etc/suricata/rules/local.rules:ro
      - ./salidas/suricata:/var/log/suricata
    depends_on: [web]

  terraform:
    image: hashicorp/terraform:1.9
    working_dir: /work
    volumes:
      - ../terraform:/work   # el Terraform corregido en Empresa con Terraform
    environment: &aws
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-1
      AWS_ENDPOINT_URL: http://floci:4566
    networks: [lab]
    profiles: [herramientas]

  auditor:
    image: instrumentisto/nmap:7.95
    networks: [lab]
    profiles: [herramientas]

  curl:
    image: curlimages/curl:8.11.1
    networks: [lab]
    profiles: [herramientas]

  aws:
    image: amazon/aws-cli:2.22.0
    environment: *aws
    networks: [lab]
    profiles: [herramientas]

networks:
  lab:
    name: lab-mini-auditoria
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  floci-data:
